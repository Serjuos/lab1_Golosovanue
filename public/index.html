<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Какой твой любимый фреймворк?</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #2d3748; }
    .option { display: flex; align-items: center; padding: 10px; border: 1px solid #e2e8f0;
              border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: .2s; }
    .option:hover { background: #f7fafc; }
    .bar { height: 20px; background: #4299e1; border-radius: 4px; transition: width .4s; }
    .result { margin-top: 8px; }
    .total { color: #718096; margin-top: 20px; }
    button { background: #4299e1; color: white; border: none; padding: 10px 20px;
             border-radius: 6px; cursor: pointer; font-size: 16px; }
    button:hover { background: #3182ce; }
    .msg { margin-top: 12px; color: #2f855a; font-weight: 500; }
    input[type="text"] { padding: 8px; border: 1px solid #e2e8f0; border-radius: 6px; 
                         font-size: 16px; width: 100%; margin-bottom: 12px; }
    .nav { margin-bottom: 20px; }
    .nav a { color: #4299e1; text-decoration: none; }
    .nav a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="results.html">📊 Посмотреть все результаты →</a>
  </div>
  
  <h1>🚀 Какой твой любимый фреймворк?</h1>
  
  <label for="userName"><strong>Ваше имя:</strong></label>
  <input type="text" id="userName" placeholder="Введите ваше имя" required>
  
  <div id="options"></div>
  <button onclick="submitVote()">Проголосовать</button>
  <div class="msg" id="msg"></div>

  <h2>Результаты</h2>
  <div id="results"></div>
  <div class="total" id="total"></div>

  <script>
    const API = '/api';
    let selectedId = null;

    async function loadFrameworks() {
      const res = await fetch(`${API}/frameworks`);
      const list = await res.json();
      document.getElementById('options').innerHTML = list.map(f => `
        <label class="option">
          <input type="radio" name="fw" value="${f.id}" onchange="selectedId=${f.id}">
          &nbsp;${f.name}
        </label>
      `).join('');
    }

    async function loadResults() {
      const res = await fetch(`${API}/results`);
      const { total, items } = await res.json();
      document.getElementById('results').innerHTML = items.map(i => `
        <div class="result">
          <strong>${i.name}</strong> — ${i.votes} голосов (${i.percent}%)
          <div class="bar" style="width:${i.percent}%"></div>
        </div>
      `).join('');
      document.getElementById('total').textContent = `Всего голосов: ${total}`;
    }

    async function submitVote() {
      const userName = document.getElementById('userName').value.trim();
      if (!userName) { 
        alert('Введите ваше имя'); 
        return; 
      }
      if (!selectedId) { 
        alert('Выбери фреймворк'); 
        return; 
      }
      
      const res = await fetch(`${API}/vote`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ frameworkId: selectedId, userName: userName })
      });
      const data = await res.json();
      document.getElementById('msg').textContent = data.message || data.error;
      loadResults();
    }

    loadFrameworks();
    loadResults();
  </script>
</body>
</html>
